# Registro de modos de persistência (#8). Uma entrada por tabela que as migrações criam, ao lado de
# supabase/migrations/. Lido pela revisão de persistência (PER-1, PER-7, PER-8, IDX-3, MT-1).
# Desenho que o originou: supabase/persistence-design-devolucao.md.
#
# mode:     append-only | upsert-with-history | ephemeral
# history:  onde mora o histórico de uma tabela upsert
#           json-child-table | json-column | version-collection | sibling-items | history-table | none
#           in-row-transition: extensão deste projeto, ver outbox_return_notes e a nota de desenho;
#           uma única transição terminal, com quem e quando na própria linha e o estado anterior implícito.
# reason:   por que uma tabela ephemeral não guarda registro pelo qual o sistema responde
# growth:   fixed para tabela de consulta que só um carregador versionado ou uma migração grava
# gap:      o que as gravações de hoje ainda não cumprem do modo declarado; decisão a registrar
#
# #12: acrescenta issued_return_notes e outbox_supplier_emails (desenho em
# supabase/persistence-supplier-request.md); a estratégia de unidade de trabalho é a da #8.
# Primeira versão (#8): declara as tabelas que a camada de persistência da devolução lê ou grava e
# toda a base do kit. Ainda sem modo declarado, a declarar pelo dono de cada uma: titles,
# outbox_dock_actions, outbox_registry_corrections, outbox_store_actions, claude_suggestions,
# exceptions, automation_runs.

database: postgresql 17          # supabase/config.toml, [db] major_version = 17
migrations: supabase/migrations  # migrações do Supabase CLI, YYYYMMDDHHMMSS_nome.sql

strategies:
  # Não há unidade de trabalho em código: o Worker fala com o banco pelo PostgREST
  # (api/src/connectors/supabase-rest.ts) e cada requisição roda numa transação própria
  # (PostgREST, Transactions). Um caso de uso que grava mais de uma requisição não é atômico.
  unit_of_work: postgrest-request
  tenancy:
    # A Já Chegou é uma empresa só; loja (store, destino) é um lugar dela, não um inquilino.
    # O RLS ligado e sem política das migrações (#52, #59) é controle de acesso, não isolamento de inquilino.
    strategy: none
  idempotency:
    # #59 As caixas de saída são idempotentes por idempotency_key única: chave da nota mais o sha256 do
    # payload canônico (api/src/connectors/outbox.ts), gravadas com on_conflict e ignore-duplicates.
    outbox_key: invoice_access_key + sha256(payload canônico)
    migration: 20261115140000_outbox_idempotency.sql

tables:
  # Domínio da conferência (#59, #63). A camada #8 só lê estas.
  proposals:
    mode: upsert-with-history
    history: none
    version_column: none
    gap: >-
      A proposta é editada: a decisão grava por cima state, dock_action e justification
      (SupabaseApprovalStore.saveDecision). A decisão em si fica em approvals, mas a ação proposta
      pelo agente se perde quando a pessoa altera. Sem versão e sem histórico (PER-3, PER-4); a
      decisão de onde o histórico mora é do dono do #63.
  approvals:
    mode: append-only
    history: none
    projection: none          # uma linha por proposta (approvals_proposal_key), lida diretamente
    refusal: access-layer     # só insert nos adaptadores; o Worker usa a chave secreta, sem papel próprio
  invoices:
    mode: upsert-with-history
    history: none
    version_column: none
    gap: >-
      state, classification, checked_at e check_error são gravados por cima (invoice-store,
      propose-checked, saveDecision), sem versão e sem histórico (PER-3, PER-4). items, number e
      supplier_id, que a #8 lê, vêm da SEFAZ e não mudam depois da captura. Decisão do dono do #59.
  divergences:
    mode: append-only
    history: none
    projection: none          # lidas com a nota; a conferência as grava por upsert na chave (invoice_access_key, seq)
    refusal: access-layer
    gap: >-
      invoice-store grava com upsert merge-duplicates na mesma chave, e ops/reconferir.ts apaga a
      tabela inteira (PER-2, PER-5). A reconferência é a operação do ambiente de formação (#56).

  # Caixa de saída e fila da devolução (#59, #140). A #8 só insere nela.
  outbox_return_notes:
    mode: upsert-with-history
    history: in-row-transition
    version_column: status    # o PATCH filtra status=eq.pendente: a escrita sobre estado velho não pega linha
    idempotency: idempotency_key
    gap: >-
      O payload é o fato e nunca muda; status sai de pendente uma vez, para emitida ou cancelada, com
      quem e quando nas colunas da linha e as checagens outbox_return_notes_emitida_check e
      _cancelada_check. Não é a forma de docs/entity-history.md (uma linha de histórico por mudança);
      vale enquanto houver uma só transição terminal. ops/reconferir.ts apaga a tabela inteira (PER-5).

  # Pedido ao fornecedor e nota emitida pelo mock (#12). Desenho: supabase/persistence-supplier-request.md.
  issued_return_notes:
    mode: append-only
    history: none
    # #12: a nota que o mock emitiu é um fato; nunca muda nem sai.
    projection: none             # lida direto pela chave (queue_id ou id); não há estado derivado
    refusal: grant               # revoke update, delete, truncate de anon, authenticated e service_role
    ids: "id bigint generated always as identity (maxvalue 999999999) = a sequência: ND-<id>, número <id>"

  outbox_supplier_emails:
    mode: upsert-with-history
    history: json-column
    history_column: history      # jsonb, lista de {version, at, by, action, state}; estado inteiro depois
    version_column: version
    # #12: o pedido ao fornecedor (raiz SupplierRequest): a pessoa edita o corpo do rascunho e o estado
    # anda; histórico na própria linha porque o PostgREST não dá transação entre duas tabelas.
    send_guard: "send_claim uuid + send_claimed_at timestamptz (trava do envio, com prazo)"
    deletion: none               # nada é apagado; o fim é status = discarded com motivo, quem e quando
    erasure: not stated          # sent_by e discarded_by identificam pessoas (ADR-005); sem caminho de apagamento registrado
    # #35: a cobrança da leitura (#4/AC-2, AC-3) mora nesta linha, nas colunas follow_up_*, e segue a mesma
    # #35: disciplina: todo PATCH filtra version=eq.<lida>, soma 1 e acrescenta a entrada em history no mesmo PATCH.
    # #35: depois de `sent` a #12 não grava mais a linha (markSent e discard não partem de `sent`), então as
    # #35: gravações da cobrança são as únicas num pedido enviado. Desenho: supabase/persistence-supplier-reply.md.
    extended_by: "#35"
    follow_up_columns: "follow_up_draft jsonb, follow_up_rejection, follow_up_claimed_at, follow_up_sent_by, follow_up_sent_at, follow_up_channel, follow_up_provider_message_id, follow_up_failure"
    follow_up_guard: "follow_up_claimed_at timestamptz (reivindicação do envio da cobrança, sem prazo: só a falha a solta)"
    follow_up_history_actions: "follow_up_drafted | follow_up_rejected | follow_up_claimed | follow_up_failed | follow_up_sent"

  # Leitura da resposta do fornecedor (#35, história #4). Desenho: supabase/persistence-supplier-reply.md.
  # #35: a unidade de trabalho segue postgrest-request; cada gravação abaixo é uma requisição, numa tabela.
  inbox_supplier_messages:
    mode: upsert-with-history
    history: in-row-transition
    version_column: read_status  # o PATCH filtra read_status=eq.pending: sai de pending uma vez, para ok ou error
    # #35: a mensagem (remetente, texto, anexos, chegada) é um fato e nunca muda; read_status sai de pending
    # #35: uma vez, com quando (read_status_at) e, no erro, o motivo fechado (read_error) na própria linha.
    refusal: grant               # revoke update, delete, truncate; grant update só em (read_status, read_error, read_status_at)
    idempotency: source_message_id   # o script de exemplo (e um webhook de entrada futuro) grava com on_conflict
    deletion: none
    erasure: not stated          # from_address e body podem trazer dado pessoal do contato do fornecedor; sem caminho registrado

  supplier_reply_readings:
    mode: append-only
    history: none
    # #35: cada leitura é um fato: "a mensagem M foi lida assim" ou "o prazo venceu sem resposta" (message_id nulo).
    # #35: a leitura atual do pedido é derivada da ordem das mensagens, nunca gravada por cima.
    projection: "leitura atual por pedido: a primeira por message_id desc nulls last (no_reply só vale sem leitura de mensagem)"
    rebuild_test: "teste do adaptador que remonta a leitura atual de leituras gravadas em qualquer ordem (persistence-supplier-reply.md, Testes)"
    refusal: grant               # revoke update, delete, truncate de anon, authenticated e service_role

  # Base do kit (#52, ADR-001): espelho dos JSON de data/kit/, que é a fonte versionada.
  kit_fornecedores: &kit   # #12: ganha a coluna email (migração da #12); o modo é o da #8
    mode: ephemeral
    reason: >-
      Cópia de data/kit/*.json recarregada por scripts/load_kit.py com upsert na chave primária; o
      registro é o arquivo versionado no git (ADR-001). A aplicação só lê.
    growth: fixed
  kit_produtos: *kit
  kit_ordens: *kit
  kit_ordem_itens: *kit
  kit_notas: *kit
  kit_nota_itens: *kit
  kit_notas_lancadas: *kit
  kit_nota_lancada_itens: *kit
  kit_pagamentos: *kit
  kit_recebimentos: *kit
  kit_recebimento_itens: *kit
  kit_regua: *kit
  kit_excecoes: *kit
